name: Zeus build & release

# Builds Zeus for Windows x86_64 on GitHub's machines, uploads the installer,
# portable zip, and SHA256SUMS.txt as workflow artifacts, and creates/updates
# a GitHub Release on `v*` tag pushes or when `create_release` is true.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create or update a GitHub Release"
        type: boolean
        required: false
        default: false
      tag:
        description: "Release tag when create_release is true (defaults to v<version>)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: zeus-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary by settings.rs so the GIF picker works without each
  # user pasting a key of their own. Without the secret the build ships keyless
  # and the picker asks for one.
  ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY || secrets.FASTSAPP_GIPHY_KEY }}

jobs:
  build:
    name: build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x86_64-pc-windows-msvc
      - run: cargo build --locked --release --features demo --target x86_64-pc-windows-msvc

      - name: Version
        id: v
        shell: pwsh
        run: |
          $line = Get-Content -LiteralPath Cargo.toml | Where-Object { $_ -match '^version\s*=\s*"([^"]+)"' } | Select-Object -First 1
          if ($line -match '^version\s*=\s*"([^"]+)"') {
            "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            throw "Could not parse version from Cargo.toml"
          }

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      - name: Installer (Windows)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=${{ steps.v.outputs.version }}" "/DArch=x86_64" `
            "/DBinary=$PWD\target\x86_64-pc-windows-msvc\release\zeus.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\zeus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable archive (Windows)
        shell: pwsh
        run: |
          $version = "${{ steps.v.outputs.version }}"
          $name = "zeus-v$version-x86_64-pc-windows-msvc"
          $stage = Join-Path "dist" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath "target\x86_64-pc-windows-msvc\release\zeus.exe", "README.md", "LICENSE", "THIRD-PARTY-NOTICES.md" -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "dist\$name.zip" -Force
          Remove-Item -LiteralPath $stage -Recurse -Force
          $sums = Get-ChildItem -LiteralPath "dist" -File |
            Where-Object { $_.Extension -in ".exe", ".zip" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          [System.IO.File]::WriteAllLines("$PWD\dist\SHA256SUMS.txt", $sums, [System.Text.UTF8Encoding]::new($false))

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zeus-windows-x86_64
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    needs: [build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: zeus-windows-x86_64
          path: dist
      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            $tag = $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG
          } else {
            $line = Get-Content -LiteralPath Cargo.toml | Where-Object { $_ -match '^version\s*=\s*"([^"]+)"' } | Select-Object -First 1
            if ($line -match '^version\s*=\s*"([^"]+)"') {
              $tag = "v$($Matches[1])"
            } else {
              throw "Could not parse version from Cargo.toml"
            }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Zeus ${{ steps.tag.outputs.tag }}
          files: dist/*
          prerelease: false
          generate_release_notes: true
