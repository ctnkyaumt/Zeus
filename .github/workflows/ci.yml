name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Dependencies come only from the approved sources in CONTRIBUTING.md, and
  # review evidence (captures, comparison pages, recordings) stays in the pull
  # request instead of the tree. See CONTRIBUTING.md.
  policy:
    name: policy
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Dependency sources
        run: python .github/scripts/check-dependency-sources.py
      - name: No review evidence in the tree
        if: ${{ !cancelled() }}
        run: python .github/scripts/check-review-evidence.py
      - name: Policy check regressions
        if: ${{ !cancelled() }}
        run: python .github/scripts/test-policy-checks.py

  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # After the toolchain, so the cache key follows the pinned rustc. The
      # key carries no job name, so each job sets its own generation. Saves
      # only on pushes to main; pull requests restore.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: quality-win-x64-v1
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: mbx clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: mbx doc --locked --all-features --no-deps

  test:
    name: test (windows-x86_64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-win-x64-v1
      # The demo feature carries the headless layout test of every screen.
      - name: Tests (default features)
        run: mbx test --locked --all-targets
      - name: Tests (all features)
        run: mbx test --locked --all-targets --all-features
